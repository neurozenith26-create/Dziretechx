# Netlify build & deploy configuration for Dzire Techx website (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production context: this is what gets published from the production branch (main).
[context.production]
  command = "npm run build"

# SPA fallback — every route serves index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
